<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Las Aventuras de Joaquincito</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Un juego de plataformas para llegar al colegio.">
<!-- Generated by tools/make-favicon.js straight from the player sprite. -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<!-- Force landscape on mobile (iOS Safari respects this in PWA mode; otherwise we use JS). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Joaquincito">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #14101f;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #241b38 0%, #14101f 70%);
    font-family: monospace;
  }
  #game {
    width: 100%;
    height: 100%;
  }
  #game canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* Landscape-only hint: hide content in portrait on mobile. */
  @media (max-width: 767px) and (orientation: portrait) {
    #game { display: none !important; }
    #portrait-msg { display: flex !important; }
  }
  #portrait-msg {
    display: none;
    position: fixed; inset: 0;
    background: #14101f;
    color: #f4e9c8;
    font: 18px/1.5 monospace;
    text-align: center;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    z-index: 9999;
  }
  /* Shown only if the browser cannot give us a 2d context at all. */
  #fallback {
    display: none;
    color: #f4e9c8;
    text-align: center;
    padding: 2rem;
    font-size: 14px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="portrait-msg">Gira el dispositivo 📱</div>
<div id="game"></div>
<div id="fallback">
  <p><strong>No se pudo iniciar el juego.</strong></p>
  <p>Tu navegador necesita soporte de canvas 2D.<br>
  Prueba con una versi&oacute;n reciente de Chrome, Edge, Firefox o Safari.</p>
</div>

<!-- Phaser 3, vendored so the game runs offline with no build step. -->
<script src="vendor/phaser.min.js"></script>

<!--
  Classic scripts (not ES modules) on purpose: ES modules are blocked by the
  browser's CORS rules on the file:// protocol, and this game must be playable
  by double-clicking index.html with no web server.
  Every file hangs off the single global `window.JA` namespace.
-->
<script src="src/core/pixel.js"></script>
<script src="src/core/font.js"></script>
<script src="src/core/palette.js"></script>
<script src="src/core/sprites.js"></script>
<script src="src/core/tiles.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/save.js"></script>
<script src="src/data/levels.js"></script>
<script src="src/scenes/BootScene.js"></script>
<script src="src/scenes/TitleScene.js"></script>
<script src="src/scenes/MapScene.js"></script>
<script src="src/scenes/GameScene.js"></script>
<script src="src/scenes/HudScene.js"></script>
<script src="src/game.js"></script>
</body>
</html>
